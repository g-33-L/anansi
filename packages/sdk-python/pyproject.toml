[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anansi-memory"
version = "0.3.1"
description = "The memory layer for AI apps — persistent, synthesized context for any LLM application"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["memory", "llm", "ai", "rag", "context", "vector", "anansi"]
authors = [{ name = "Anansi" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/g-33-L/anansi"
Repository = "https://github.com/g-33-L/anansi"

[tool.hatch.build.targets.wheel]
packages = ["anansi_memory"]
